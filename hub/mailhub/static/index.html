<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orgtree mail hub</title>
<style>
  /* follows the orgtree ui-guide visual language: dark greys, terracotta
     accent, chip idiom — deliberately no build step and no external assets */
  :root {
    color-scheme: dark;
    --bg: #1f1f1f; --side: #181818; --panel: #252526; --panel-2: #2d2d30;
    --ink: #cccccc; --ink-strong: #e8e8e8; --dim: #9d9d9d;
    --line: #3c3c3c; --line-soft: #2b2b2b;
    --accent: #d97757; --ok: #6fd377; --bad: #f14c4c; --sky: #7cc0ff;
    --mono: Consolas, 'Cascadia Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 'Segoe UI', system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px;
           padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
  header h1 { font-size: 15px; margin: 0; color: var(--ink-strong); }
  header .dim { color: var(--dim); font-size: 12px; }
  .chip { border: 1px solid var(--line); border-radius: 10px;
          padding: 1px 8px; font-size: 11px; color: var(--dim); }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 0;
         height: calc(100vh - 45px); }
  aside { border-right: 1px solid var(--line-soft); background: var(--side);
          overflow-y: auto; padding: 8px; }
  section { overflow-y: auto; padding: 10px 14px; }
  .org { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
         border-radius: 5px; cursor: pointer;
         border-left: 3px solid transparent; }
  .org:hover { background: var(--panel-2); }
  .org.current { background: var(--panel-2); outline: 1px solid var(--line); }
  /* FR-11: kind is the color axis — an org row wears the terracotta accent,
     an independently connected CHAT wears sky, so the two kinds read apart
     at a glance even inside one client's group */
  .org.k-org { border-left-color: var(--accent); }
  .org.k-chat { border-left-color: var(--sky); }
  .kindtag { font-size: 9.5px; border: 1px solid var(--line);
             border-radius: 8px; padding: 0 5px; color: var(--sky);
             flex: none; }
  /* FR-11: one header per CLIENT (the slug's username part) — grouping is
     spatial, color is spent on org-vs-chat */
  .client { color: var(--dim); font-size: 10.5px; text-transform: uppercase;
            letter-spacing: 0.06em; padding: 10px 8px 3px;
            border-bottom: 1px solid var(--line-soft); margin-bottom: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
         background: var(--line); }
  .dot.on { background: var(--ok); }
  .org .slug { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .org .fp { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .org .q { margin-left: auto; color: var(--sky); font-size: 11px; }
  .org .last { color: var(--dim); font-size: 10.5px; }
  .msg { border: 1px solid var(--line-soft); border-radius: 6px;
         padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
  .msg .head { display: flex; gap: 8px; align-items: baseline;
               font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }
  .msg .head b { color: var(--ink-strong); font-weight: 600; }
  .msg .head .arrow { color: var(--accent); }
  .msg .state { margin-left: auto; font-size: 10.5px; }
  .msg .state.queued { color: var(--sky); }
  .msg .state.read { color: var(--ok); }
  .msg .body { margin-top: 5px; white-space: pre-wrap; word-break: break-word;
               font-size: 12.5px; max-height: 220px; overflow-y: auto; }
  .msg .att { margin-top: 4px; font-size: 11px; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .allbtn { width: 100%; text-align: left; background: none; color: var(--ink);
            border: none; padding: 6px 8px; border-radius: 5px; cursor: pointer;
            font: inherit; }
  .allbtn:hover, .allbtn.current { background: var(--panel-2); }
</style>
</head>
<body>
<header>
  <h1 id="hubname">mail hub</h1>
  <span class="chip" id="stats"></span>
  <span class="dim">read-only · everything here is visible to anyone who can
    reach this page — run the hub on a box you control</span>
</header>
<main>
  <aside id="orgs"></aside>
  <section id="msgs"></section>
</main>
<script>
'use strict'
let filter = ''            // '' = global view (ruled: operator sees all)
const el = (id) => document.getElementById(id)

const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]))

function ago (iso) {
  if (!iso) return 'never'
  const s = (Date.now() - Date.parse(iso)) / 1000
  if (!isFinite(s)) return iso
  if (s < 90) return 'just now'
  if (s < 5400) return Math.round(s / 60) + ' min ago'
  if (s < 129600) return Math.round(s / 3600) + ' h ago'
  return Math.round(s / 86400) + ' d ago'
}

async function refresh () {
  try {
    const d = await (await fetch('/ui/data')).json()
    el('hubname').textContent = d.name + ' · mail hub'
    document.title = d.name + ' · orgtree mail hub'
    const total = d.orgs.reduce((a, o) => a + o.queued, 0)
    el('stats').textContent = d.orgs.length + ' orgs · ' + total + ' queued · '
      + d.retention_days + ' d retention'
    const side = ['<button class="allbtn' + (filter ? '' : ' current')
      + '" onclick="pick(\'\')">all traffic</button>']
    // FR-11: group by CLIENT (username — every org/chat registered from one
    // machine profile shares it), then render each group under a header.
    // Color codes KIND (org vs independently connected chat), not client:
    // grouping is the spatial signal, color is the categorical one.
    const groups = new Map()
    for (const o of d.orgs) {
      const client = o.username || o.slug.split('.')[1] || '?'
      if (!groups.has(client)) groups.set(client, [])
      groups.get(client).push(o)
    }
    for (const client of [...groups.keys()].sort()) {
      const rows = groups.get(client).sort(
        (a, b) => a.slug < b.slug ? -1 : 1)
      side.push('<div class="client">' + esc(client) + ' · '
        + rows.length + '</div>')
      for (const o of rows) {
        const parts = o.slug.split('.')
        const fp = parts.length > 2 ? parts.pop() : ''
        const kind = o.kind === 'chat' ? 'chat' : 'org'
        side.push('<div class="org k-' + kind
          + (filter === o.slug ? ' current' : '')
          + '" onclick="pick(\'' + esc(o.slug) + '\')">'
          + '<span class="dot' + (o.online ? ' on' : '') + '"></span>'
          + '<span><div class="slug">' + esc(parts.join('.'))
          + ' <span class="fp">·' + esc(fp) + '</span>'
          + (kind === 'chat' ? ' <span class="kindtag">chat</span>' : '')
          + '</div>'
          + '<div class="last">' + (o.online ? 'online' : ago(o.last_seen))
          + (o.blurb ? ' · ' + esc(o.blurb) : '') + '</div></span>'
          + (o.queued ? '<span class="q">' + o.queued + ' queued</span>' : '')
          + '</div>')
      }
    }
    el('orgs').innerHTML = side.join('')
    const m = await (await fetch('/ui/messages?limit=200'
      + (filter ? '&org=' + encodeURIComponent(filter) : ''))).json()
    if (!m.messages.length) {
      el('msgs').innerHTML = '<div class="empty">no mail yet</div>'
      return
    }
    el('msgs').innerHTML = m.messages.map((x) => {
      const st = x.read_at ? 'read' : x.delivered_at ? 'delivered'
        : x.state === 'fetched' ? 'fetched' : 'queued'
      return '<div class="msg"><div class="head"><b>' + esc(x.from)
        + '</b><span class="arrow">→</span><b>' + esc(x.to) + '</b>'
        + '<span>' + ago(x.received_at) + '</span>'
        + '<span class="state ' + st + '">' + st + '</span></div>'
        + '<div class="body">' + esc(x.body) + '</div>'
        + (x.attachments && x.attachments.length
          ? '<div class="att">📎 ' + x.attachments.map(
              (a) => esc(a.name) + ' (' + Math.round(a.bytes / 1024) + ' KB)')
              .join(' · ') + '</div>' : '')
        + '</div>'
    }).join('')
  } catch (e) {
    el('stats').textContent = 'hub unreachable'
  }
}

function pick (slug) { filter = slug; refresh() }
window.pick = pick
refresh()
setInterval(refresh, 5000)
</script>
</body>
</html>
